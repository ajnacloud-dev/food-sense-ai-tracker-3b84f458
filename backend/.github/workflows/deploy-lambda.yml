name: Deploy Backend to Lambda

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-lambda.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nutriwealth-backend
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r src/requirements.txt
          uv pip install --system pytest pytest-cov pytest-asyncio black flake8

      - name: Run linting
        run: |
          black --check src/
          flake8 src/ --max-line-length=120 --ignore=E203,W503
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml
        continue-on-error: true

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: backend
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: image
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${{ steps.env.outputs.environment }}-${TIMESTAMP}-${SHORT_SHA}"
          URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "uri=${URI}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.env.outputs.environment }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ steps.deploy.outputs.function-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Update Lambda function code
        id: deploy
        run: |
          FUNCTION_NAME="nutriwealth-backend-${{ steps.env.outputs.environment }}"

          # Update function code
          aws lambda update-function-code \
            --function-name ${FUNCTION_NAME} \
            --image-uri ${{ needs.build.outputs.image-uri }} \
            --publish \
            --output json > deploy-output.json

          VERSION=$(jq -r '.Version' deploy-output.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Update or create alias
          aws lambda update-alias \
            --function-name ${FUNCTION_NAME} \
            --name ${{ steps.env.outputs.environment }} \
            --function-version ${VERSION} 2>/dev/null || \
          aws lambda create-alias \
            --function-name ${FUNCTION_NAME} \
            --name ${{ steps.env.outputs.environment }} \
            --function-version ${VERSION}

          # Get function URL if exists
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name ${FUNCTION_NAME} \
            --query FunctionUrl \
            --output text 2>/dev/null || echo "")
          echo "function-url=${FUNCTION_URL}" >> $GITHUB_OUTPUT

      - name: Wait for Lambda update
        run: |
          FUNCTION_NAME="nutriwealth-backend-${{ steps.env.outputs.environment }}"
          aws lambda wait function-updated --function-name ${FUNCTION_NAME}

      - name: Update environment variables
        run: |
          FUNCTION_NAME="nutriwealth-backend-${{ steps.env.outputs.environment }}"

          # Prepare environment variables based on environment
          if [[ "${{ steps.env.outputs.environment }}" == "prod" ]]; then
            AUTH_MODE="cognito"
            LOG_LEVEL="WARNING"
            ENABLE_SQS="true"
          elif [[ "${{ steps.env.outputs.environment }}" == "staging" ]]; then
            AUTH_MODE="cognito"
            LOG_LEVEL="INFO"
            ENABLE_SQS="true"
          else
            AUTH_MODE="local"
            LOG_LEVEL="DEBUG"
            ENABLE_SQS="false"
          fi

          # Update function configuration
          aws lambda update-function-configuration \
            --function-name ${FUNCTION_NAME} \
            --environment "Variables={
              ENVIRONMENT=${{ steps.env.outputs.environment }},
              AUTH_MODE=${AUTH_MODE},
              LOG_LEVEL=${LOG_LEVEL},
              ENABLE_SQS=${ENABLE_SQS},
              IBEX_API_URL=${{ secrets.IBEX_API_URL }},
              IBEX_API_KEY=${{ secrets.IBEX_API_KEY }},
              TENANT_ID=${{ secrets.TENANT_ID }},
              OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},
              GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},
              ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},
              S3_BUCKET=${{ secrets.S3_BUCKET }},
              AI_PROCESSING_QUEUE_URL=${{ secrets.AI_PROCESSING_QUEUE_URL }},
              COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }},
              COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
            }"

      - name: Run smoke tests
        run: |
          FUNCTION_NAME="nutriwealth-backend-${{ steps.env.outputs.environment }}"
          FUNCTION_URL="${{ steps.deploy.outputs.function-url }}"

          if [[ -n "${FUNCTION_URL}" ]]; then
            echo "Testing function URL: ${FUNCTION_URL}"

            # Test health endpoint
            curl -f -s -X GET "${FUNCTION_URL}health" || echo "Health check not available"

            # Test model config endpoint
            curl -f -s -X GET "${FUNCTION_URL}v1/models/config" \
              -H "Authorization: Bearer test-token" || echo "Model config endpoint failed"
          else
            echo "No function URL configured, skipping smoke tests"
          fi

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deployment Summary

          **Environment:** ${{ steps.env.outputs.environment }}
          **Function:** nutriwealth-backend-${{ steps.env.outputs.environment }}
          **Version:** ${{ steps.deploy.outputs.version }}
          **Image:** ${{ needs.build.outputs.image-uri }}
          **URL:** ${{ steps.deploy.outputs.function-url }}

          ### Deployment Details
          - **Trigger:** ${{ github.event_name }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Actor:** ${{ github.actor }}
          - **Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ### Next Steps
          1. Monitor CloudWatch logs
          2. Check CloudWatch metrics
          3. Verify API endpoints

          ### Rollback Command
          \`\`\`bash
          aws lambda update-alias \\
            --function-name nutriwealth-backend-${{ steps.env.outputs.environment }} \\
            --name ${{ steps.env.outputs.environment }} \\
            --function-version \$PREVIOUS_VERSION
          \`\`\`
          EOF

  monitor:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy, build]
    if: github.event_name != 'pull_request'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Check Lambda metrics
        run: |
          FUNCTION_NAME="nutriwealth-backend-${{ steps.env.outputs.environment }}"

          # Check for errors in last 5 minutes
          ERRORS=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=${FUNCTION_NAME} \
            --start-time $(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%S) \
            --end-time $(date -u +%Y-%m-%dT%H:%M:%S) \
            --period 300 \
            --statistics Sum \
            --query 'Datapoints[0].Sum' \
            --output text)

          if [[ "${ERRORS}" != "None" && "${ERRORS}" != "0" ]]; then
            echo "⚠️ Warning: ${ERRORS} errors detected in the last 5 minutes"
          else
            echo "✅ No errors detected"
          fi

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment ${{ job.status }} for nutriwealth-backend-${{ steps.env.outputs.environment }}
            Version: ${{ needs.deploy.outputs.version }}
            Actor: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true