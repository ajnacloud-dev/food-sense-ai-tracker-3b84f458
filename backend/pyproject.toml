[project]
name = "food-app-backend"
version = "0.1.0"
description = "Food tracking app backend - AWS Lambda"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "boto3>=1.34.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
